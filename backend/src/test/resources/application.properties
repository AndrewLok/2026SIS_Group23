# The tests run on in-memory H2, with Hibernate making the tables, so they need no database installed.
# The migrations are Postgres SQL and are not run here: they are checked against the entities when the
# server starts against Postgres (ddl-auto: validate).
spring.datasource.url=jdbc:h2:mem:voyagerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
