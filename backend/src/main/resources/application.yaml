server:
  servlet:
    session:
      timeout: 14d
      cookie:
        http-only: true   # JavaScript on the page cannot read the login cookie.
        same-site: lax    # Not sent on cross-site POSTs. This is what stands in for CSRF tokens.
        max-age: 14d      # Survives closing the browser, so a phone stays signed in for the whole trip.
        # secure: true    # Turn on once this is served over HTTPS; it has to stay off for http://localhost.

spring:
  application:
    name: voyager-backend
  datasource:
    url: jdbc:h2:mem:voyagerdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    open-in-view: false   # Queries belong in services, not in view rendering. Also silences a startup warning.
    hibernate:
      ddl-auto: update    # Fine for an in-memory database that starts empty. Against a real one, use migrations and "validate".
    show-sql: false       # Switch on while debugging a query; it is far too noisy to leave on.
  # The H2 web console is deliberately not enabled. It is a way into the whole database, and it is not
  # covered by the login. If you need it while developing, turn it on in a dev-only profile.